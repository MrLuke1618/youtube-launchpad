<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-purple': '#8A42E2',
              'brand-purple-light': '#A467F5',
              'dark-bg': '#131221',
              'dark-card': '#1D1B2E',
              'dark-border': '#312F45',
              'dark-text': '#E5E7EB',
              'dark-text-secondary': '#9CA3AF',
            },
          },
        },
      }
    </script>
    <style>

    <!-- REMOVED React 18 UMD scripts to resolve version conflict with importmap -->
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    <script src="https://unpkg.com/mammoth@1.7.1/mammoth.browser.min.js"></script>

    <!-- ADDED Babel for in-browser TSX/JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",

<link rel="stylesheet" href="/index.css">
</head>

  <script type="module" src="/index.tsx"></script>
